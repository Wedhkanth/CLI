[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pantry"
version = "0.1.0"
description = "A command-line tool for managing bakery inventory"
requires-python = ">=3.12"

[project.scripts]
pantry = "pantry.cli:main"

[tool.setuptools.packages.find]
include = ["pantry*"]